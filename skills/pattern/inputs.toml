# SPDX-License-Identifier: Apache-2.0
#
# What this skill needs from the repository it is installed into, and nothing about
# where any of it lives. The consuming repository answers in [suite.pattern]
# of its .agents/skill-bindings.toml.
#
# Checked by:  python <skills>/model/bin/model.py doctor --skill pattern
#
# This skill ships no runtime of its own. It borrows the model skill's resolver, which is
# why `model` is a declared dependency rather than a suggestion.

[inputs]
short_description = "Bindings required to author a pattern in this repository"

[inputs.options.outputDir]
type = "dir"
required = true
description = "Directory new pattern folders are created in"

[inputs.options.template]
type = "file"
required = false
description = """The repository's own pattern template, used instead of the
generic one this skill ships. A template carries a house profile: the identifier series,
the deliverable code, the diagram palette and any conformance statement. That profile
belongs to the repository, not to a published skill."""

[inputs.options.idSeries]
type = "str"
required = false
default = "PAT"
description = "Identifier prefix for patterns, e.g. PAT gives PAT-001"

[inputs.options.deckTheme]
type = "str"
required = false
description = """Theme passed to markdown-deck when publishing the deck: a built-in name or a
path to a .css file, relative to the binding file. Unset, publish passes no theme and
markdown-deck chooses: the document's deck_theme, then [suite.markdown-deck] theme, then
its own default. A document's deck_theme always wins over this."""

[inputs.options.ontologySchema]
type = "file"
required = false
description = """The repository's own ontology schema, which the document's section structure is
expected to conform to. The repository owns and edits it; the skill only reads it, as guidance for
the section order."""

[inputs.options.ontologySchemaSha256]
type = "str"
required = false
description = """SHA-256 of ontologySchema. Only for a schema that is a copy of one maintained
elsewhere and never edited here: a copy that drifts is then an error. Leave it unset for a schema
the repository maintains itself, or every edit to the schema breaks `doctor` until it is updated."""

# Links from each box to its page are model bindings, not pattern ones: [model]
# link_site and link_target ("new" or "same"), and [[links]] rules of match, locate,
# href and target, in the binding file beside [[catalogues]]. See SKILL.md, "Links to
# each box's page", and `model doctor --doc <file>`.

[inputs.options.patternsRoot]
type = "dir"
required = false
description = """Where a participation step's Uses finds the participating pattern, searched to any depth.
Unset, outputDir is used; model's own [model] patterns_root wins over both."""

[inputs.options.approvedStatuses]
type = "list"
required = false
default = ["Final", "Approved", "Active", "Published"]
description = """Front matter statuses that count as approved. A pattern whose status is one of
these cannot rest on a participating pattern that is not, or on an open (TBD) one."""
