bindingsVersion = "1.0"

# Contract for the composite example: the pattern template's tables, the ABB and IF
# series, and plain-number local ids. patterns_root is where a Uses cell's participating
# pattern is looked for: here the examples folder, which holds knowledge-retrieval, PAT-900.

[model]
node_id_attrs = ["abb_id"]
edge_id_attr  = "iface_id"
local_pattern = '[0-9]{1,3}'
patterns_root = ".."

[[markdown.tables]]
section    = "Building Blocks"
entity     = "node"
id_pattern = 'ABB-[0-9]{3}'
columns    = { id = "Building Block", label = "Building Block", group = "Source" }

[[markdown.tables]]
section    = "Interfaces"
entity     = "edge"
id_pattern = 'IF-[0-9]{2,3}|ABB-[0-9]{3}'
columns    = { id = "Interface", source = "Provider", target = "Consumer", label = "Purpose" }

[markdown.scenarios]
section         = "Scenarios"
heading_pattern = '^(S[0-9]+)\b[\s:.-]*(.*)$'
columns         = { step = "Step", actor = "Actor", action = "Action", edge = "Interface", target = "Target", uses = "Uses" }
