# SPDX-License-Identifier: Apache-2.0
#
# What this skill needs from the repository it is installed into, and nothing about
# where any of it lives. The consuming repository answers in [suite.use-case]
# of its .agents/skill-bindings.toml.
#
# Checked by:  python <skills>/model/bin/model.py doctor --skill use-case
#
# This skill ships no runtime of its own. It borrows the model skill's resolver and the
# pattern skill's publish.py, which is why both are declared dependencies.

[inputs]
short_description = "Bindings required to author a use case in this repository"

[inputs.options.outputDir]
type = "dir"
required = true
description = """Directory endorsed use cases live in, each with a registered identifier from
idSeries. A local use case lives in its container instead; see localDir."""

[inputs.options.template]
type = "file"
required = false
description = """The repository's own use case template, used instead of the generic
assets/template.md this skill ships. A house template carries the repository's own
dependency table, such as products and maturity levels, in place of the generic
Dependencies table."""

[inputs.options.idSeries]
type = "str"
required = false
default = "UC"
description = "Identifier prefix for new use cases, e.g. UC gives UC-001"

[inputs.options.register]
type = "file"
required = false
description = """The register of endorsed use cases, a CSV whose first column is the identifier.
Read for the next free number when a use case is endorsed, and given a row then. When it has
a slug column, an endorsed use case's folder takes that name. Unset,
the next number is the highest found under outputDir plus one."""

[inputs.options.localDir]
type = "str"
required = false
default = "use-cases"
description = """Folder, inside a container such as an epic or a project, that holds the
container's local use cases. A container is a folder whose name begins with its own
identifier, such as EP-12-checkout-rebuild."""

[inputs.options.localIdFormat]
type = "str"
required = false
default = "{container}-UC{n}"
description = """Identifier of a local use case. {container} is the container's identifier,
taken from the start of its folder name, and {n} the next free number in that container,
with no leading zeros."""
