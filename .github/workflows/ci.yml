name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skills:
    name: Agent Skills validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Zero-dependency on purpose, so this job needs no install step.
      - name: Validate skills against the agentskills.io spec
        run: node scripts/validate-skills.mjs skills
      - name: Validate bundle.json against the bundle schema and the skills
        run: node scripts/validate-bundle.mjs .

  example:
    name: Worked example against diagram-model and markdown-deck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The two skills this one depends on, each checked out on its own and found
      # through AGENT_SKILLS_PATH, as they would be when an agent installed them
      # somewhere other than beside pattern.
      #
      # diagram-model at the branch of the same name when one exists, so a change made in
      # both repositories is tested together before either merges; otherwise its main.
      - name: Choose the diagram-model ref
        id: model-ref
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          if git ls-remote --exit-code --heads https://github.com/dermot-obrien/diagram-model "refs/heads/$BRANCH" >/dev/null 2>&1; then
            ref="$BRANCH"
          fi
          echo "diagram-model at $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: dermot-obrien/diagram-model
          ref: ${{ steps.model-ref.outputs.ref }}
          path: .deps/diagram-model
      - uses: actions/checkout@v4
        with:
          repository: dermot-obrien/markdown-deck
          path: .deps/markdown-deck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install markdown-deck
        working-directory: .deps/markdown-deck/skills/markdown-deck
        run: npm install --no-audit --no-fund
      - name: doctor finds both dependencies
        env:
          AGENT_SKILLS_PATH: ${{ github.workspace }}/skills:${{ github.workspace }}/.deps/diagram-model/skills:${{ github.workspace }}/.deps/markdown-deck/skills
        run: |
          python .deps/diagram-model/skills/model/bin/model.py doctor --skill pattern --json > doctor.json || true
          python -c "import json,sys; d=json.load(open('doctor.json')); s=d.get('siblings',{}); print(sorted(s)); sys.exit(0 if {'model','markdown-deck'} <= set(s) else 1)"
      # An installer runs each skill's check after installing it; this runs it the same way.
      - name: The post-install check fails unbound and passes bound
        env:
          AGENT_SKILLS_PATH: ${{ github.workspace }}/skills:${{ github.workspace }}/.deps/diagram-model/skills:${{ github.workspace }}/.deps/markdown-deck/skills
        run: |
          mkdir -p /tmp/ws/.agents /tmp/ws/patterns /tmp/ws/use-cases
          if node scripts/validate-bundle.mjs --run-checks /tmp/ws --skills skills .; then
            echo "::error::the check passed with outputDir unbound"; exit 1
          fi
          printf '[suite.pattern]\noutputDir = "../patterns"\n\n[suite.use-case]\noutputDir = "../use-cases"\n' > /tmp/ws/.agents/skill-bindings.toml
          node scripts/validate-bundle.mjs --run-checks /tmp/ws --skills skills .
      - name: The worked example agrees with itself, without draw.io
        working-directory: skills/pattern/examples/knowledge-retrieval
        run: |
          MODEL="$GITHUB_WORKSPACE/.deps/diagram-model/skills/model/bin/model.py"
          DECK="$GITHUB_WORKSPACE/.deps/markdown-deck/skills/markdown-deck/bin/markdown-deck.mjs"
          # The committed model.json is what the document extracts to.
          python "$MODEL" extract index.md --format json --out /tmp/model.json
          python -c "import json,sys; sys.exit(0 if json.load(open('/tmp/model.json')) == json.load(open('model.json')) else 1)"
          # The document and the diagram agree, and syncing changes nothing.
          python "$MODEL" validate index.md --against components.drawio
          cp components.drawio /tmp/before.drawio
          python "$MODEL" sync index.md components.drawio
          cmp components.drawio /tmp/before.drawio
          # Every committed view was rendered from the diagram as it is now.
          python "$MODEL" stamp --check components.svg
          # The walkthrough builds over the committed view, and the deck builds.
          python "$MODEL" animate index.md
          node "$DECK" build index.md --out /tmp/dist --theme default --no-pdf
      - name: The use case example agrees with itself, without draw.io
        working-directory: skills/use-case/examples/uc-900
        run: |
          MODEL="$GITHUB_WORKSPACE/.deps/diagram-model/skills/model/bin/model.py"
          DECK="$GITHUB_WORKSPACE/.deps/markdown-deck/skills/markdown-deck/bin/markdown-deck.mjs"
          python "$MODEL" extract index.md --format json --out /tmp/uc-model.json
          python -c "import json,sys; sys.exit(0 if json.load(open('/tmp/uc-model.json')) == json.load(open('model.json')) else 1)"
          python "$MODEL" validate index.md --against components.drawio
          cp components.drawio /tmp/uc-before.drawio
          python "$MODEL" sync index.md components.drawio
          cmp components.drawio /tmp/uc-before.drawio
          python "$MODEL" stamp --check components.svg
          python "$MODEL" animate index.md
          node "$DECK" build index.md --out /tmp/uc-dist --theme default --no-pdf
      - name: publish.py publishes the examples from above their binding files
        working-directory: skills/pattern
        env:
          AGENT_SKILLS_PATH: ${{ github.workspace }}/.deps/diagram-model/skills:${{ github.workspace }}/.deps/markdown-deck/skills
        run: |
          python scripts/publish.py examples --recursive --no-deck --render never --json > /tmp/publish.json
          python -c "import json,sys; r=json.load(open('/tmp/publish.json'))['results']; print(r); sys.exit(0 if r and all(x['status'] == 'ok' for x in r) else 1)"
          # The use-case skill publishes with this same publish.py.
          python scripts/publish.py ../use-case/examples --recursive --no-deck --render never --json > /tmp/publish-uc.json
          python -c "import json,sys; r=json.load(open('/tmp/publish-uc.json'))['results']; print(r); sys.exit(0 if r and all(x['status'] == 'ok' for x in r) else 1)"
      - name: The composite example resolves, and the approval gate holds
        working-directory: skills/pattern/examples
        run: |
          MODEL="$GITHUB_WORKSPACE/.deps/diagram-model/skills/model/bin/model.py"
          DOC=composite/PAT-910-staff-assistant/index.md
          python "$MODEL" composition "$DOC"
          python "$MODEL" validate "$DOC"
          # One participation step runs PAT-900, one is open, nothing missing, no cycle.
          python "$MODEL" composition "$DOC" --json > /tmp/composition.json
          python -c "import json,sys; s=json.load(open('/tmp/composition.json'))['summary']; print(s); sys.exit(0 if (s['participations'], s['patterns'], s['open'], s['missing'], s['cycles']) == (2, 1, 1, 0, 0) else 1)"
          # Step 2 is bound, and joins at PAT-900 S1's declared Start and Finish.
          python -c "import json,sys; p=json.load(open('/tmp/composition.json'))['tree']['participations'][0]; print(p['binding'], p['join']); sys.exit(0 if p['binding'] == {'ABB-908': '03'} and p['join'] == {'start': 'declared', 'finish': 'declared'} else 1)"
          # Approved, it must fail: PAT-900 is not approved and a TBD remains.
          cp -r . /tmp/examples
          sed -i 's/^status: Draft/status: Approved/' /tmp/examples/$DOC
          if python "$MODEL" validate /tmp/examples/$DOC; then
            echo "::error::an approved composite pattern passed over an unapproved participating pattern"; exit 1
          fi

  versions:
    name: Each skill's versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SKILL.md, and the marketplace entry agree, per skill
        run: |
          fail=0
          for d in skills/*/; do
            name=$(basename "$d")
            skill=$(sed -n 's/^  version: "\(.*\)"/\1/p' "$d/SKILL.md")
            market=$(node -p "(require('./.claude-plugin/marketplace.json').plugins.find(p => p.name === '$name') || {}).version")
            echo "$name: SKILL.md $skill, marketplace.json $market"
            [ "$skill" = "$market" ] || fail=1
          done
          exit $fail

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v6

  skills-ref:
    name: Agent Skills reference validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # skills-ref is the reference validator the Agent Skills specification names
      # (https://agentskills.io/specification#validation). It is pinned to a commit,
      # so a change upstream cannot turn this job red on its own.
      - name: Install skills-ref
        run: python -m pip install "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: skills-ref validate, per skill
        run: |
          fail=0
          for d in skills/*/; do
            skills-ref validate "$d" || fail=1
          done
          exit $fail
      # The specification recommends a SKILL.md under 500 lines and a body under
      # 5,000 tokens, with detail moved to files the body links. skills-ref checks
      # neither, so this does, estimating tokens as characters divided by four.
      - name: SKILL.md within the specification's size guidance
        run: |
          python - <<'PY'
          import pathlib, sys
          fail = False
          for f in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = f.read_text(encoding="utf-8")
              body = text.split("---", 2)[2]
              lines, tokens = len(text.splitlines()), len(body) // 4
              ok = lines <= 500 and tokens <= 5000
              print(f"{'ok' if ok else 'FAIL'} {f}: {lines} lines, about {tokens} body tokens")
              fail |= not ok
          sys.exit(1 if fail else 0)
          PY
